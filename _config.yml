# Welcome to Jekyll!
#
author: "Vivian Lobo"

title: Viv's Thoughts
email: vivian@vivianlobo.com
description: >- # this means to ignore newlines until "baseurl:"
  Hmmm... I am still thinking. 
  Thinking about how to hire a creative writer to fill this.
baseurl: "/blog" # the subpath of your site, e.g. /blog
url: "https://vivianlobo.com/" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: VivianLobo7
github_username:  vnl
lang: en-GB
timezone: Europe/London

# Navigation and presentation
header_pages:
  - about.md
show_excerpts: true

# Minima theme options
minima:
  skin: auto # light, dark, auto
  social_links:
    - { platform: github,  user_url: "https://github.com/vnl" }
    - { platform: twitter, user_url: "https://twitter.com/VivianLobo7" }

# Build settings
markdown: kramdown
theme: minima
# remote_theme: pages-themes/hacker@v0.2.0
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-mentions
  - jekyll-include-cache

# Pagination (homepage)
paginate: 5
paginate_path: "/page:num/"

# Markdown/rendering
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/

# Optional: analytics and permalinks
# google_analytics: G-XXXXXXXXXX
# permalink: pretty            # => /year/month/day/title/
# permalink: /:categories/:title/ # => /life/how-to-use-your-free-time/
